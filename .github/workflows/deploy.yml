name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Instalar Dependências e Fazer o Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Upload pro S3
        run: |
          aws s3 sync frontend/dist s3://portifolio-pedro-machado-2026 --delete 

      - name: Limpar Cache do CloudFront (Invalidation)
        run: |
          aws cloudfront create-invalidation --distribution-id E31BNJGEDJKQ7D --paths "/*"
